name: Build and publish Windows EH corpus

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-windows-eh.yml"
      - "schema/**"
      - "scripts/**"
      - "sources/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-eh.yml"
      - "schema/**"
      - "scripts/**"
      - "sources/**"

permissions:
  contents: read

concurrency:
  group: windows-eh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-producer:
    name: Verify producer and prepare matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out producer sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run producer unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Compile-check Python scripts
        run: >-
          python3 -m py_compile
          scripts/windows_matrix.py
          scripts/verify_windows_corpus.py
          scripts/Merge-WindowsCorpus.py

      - name: Parse manifest schema
        run: >-
          python3 -m json.tool
          schema/windows-eh-manifest.schema.json
          > /dev/null

      - name: Generate supported build matrix
        id: matrix
        run: >-
          python3 scripts/windows_matrix.py
          --github-output "$GITHUB_OUTPUT"

  build-cell:
    name: ${{ matrix.cell_name }}
    needs: verify-producer
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-producer.outputs.matrix) }}
    steps:
      - name: Check out producer sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build, execute when native, and validate cell
        shell: pwsh
        run: >-
          ./scripts/Build-WindowsCorpus.ps1
          -Toolchain "${{ matrix.toolchain }}"
          -Architecture "${{ matrix.architecture }}"
          -Optimization "${{ matrix.optimization }}"
          -SecurityCookie "${{ matrix.security_cookie }}"
          -CxxFormat "${{ matrix.cxx_format }}"
          -OutputRoot "${{ runner.temp }}/windows-eh"

      - name: Upload validated cell
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-eh-${{ matrix.cell_name }}
          path: ${{ runner.temp }}/windows-eh
          if-no-files-found: error
          retention-days: 14

  assemble-corpus:
    name: Assemble canonical corpus
    needs: build-cell
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out producer sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all validated cells
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-eh-*
          path: ${{ runner.temp }}/windows-eh
          merge-multiple: true

      - name: Merge and validate the complete matrix
        run: >-
          python3 scripts/Merge-WindowsCorpus.py
          --root "${{ runner.temp }}/windows-eh"
          --fragments "${{ runner.temp }}/windows-eh/fragments"
          --output "${{ runner.temp }}/windows-eh/manifests/windows-eh.json"
          --require-complete-matrix

      - name: Preserve generated-tree notice
        run: >-
          cp corpus/windows-eh/README.md
          "${{ runner.temp }}/windows-eh/corpus/windows-eh/README.md"

      - name: Re-verify canonical manifest
        run: >-
          python3 scripts/verify_windows_corpus.py
          "${{ runner.temp }}/windows-eh/manifests/windows-eh.json"
          --root "${{ runner.temp }}/windows-eh"
          --require-complete-matrix

      - name: Upload canonical corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-eh-canonical-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/windows-eh/corpus/windows-eh
            ${{ runner.temp }}/windows-eh/manifests/windows-eh.json
          if-no-files-found: error
          retention-days: 30

  publish-corpus:
    name: Commit generated corpus to main
    needs: assemble-corpus
    # A manual run on main publishes too.  Two pushes in quick succession
    # leave the first run's publication refused by the stale-main guard
    # below, which is right -- but without this there is no way to publish
    # the result afterwards short of pushing again.  The guard still
    # applies, so a dispatch can no more publish a stale tree than a push
    # can.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out triggering main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0

      - name: Download canonical corpus
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-eh-canonical-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-eh-canonical

      - name: Verify downloaded corpus before publication
        run: >-
          python3 scripts/verify_windows_corpus.py
          "${{ runner.temp }}/windows-eh-canonical/manifests/windows-eh.json"
          --root "${{ runner.temp }}/windows-eh-canonical"
          --require-complete-matrix

      - name: Confirm source revision is still current and sync generated files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main advanced after this producer run started; refusing stale publication" >&2
            exit 1
          fi
          mkdir -p corpus/windows-eh manifests
          rsync --archive --delete \
            "$RUNNER_TEMP/windows-eh-canonical/corpus/windows-eh/" \
            corpus/windows-eh/
          cp \
            "$RUNNER_TEMP/windows-eh-canonical/manifests/windows-eh.json" \
            manifests/windows-eh.json

      - name: Re-verify repository tree
        run: >-
          python3 scripts/verify_windows_corpus.py
          manifests/windows-eh.json
          --root .
          --require-complete-matrix

      - name: Commit and fast-forward push generated files
        shell: bash
        run: |
          set -euo pipefail
          git add -- corpus/windows-eh manifests/windows-eh.json
          if git diff --cached --quiet; then
            echo "generated corpus is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(corpus): refresh Windows EH binaries [skip ci]"
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main advanced during publication; refusing stale push" >&2
            exit 1
          fi
          git push origin HEAD:main
